openapi: 3.0.3

info:
  title: TechShop API
  description: |
    REST API интернет-магазина TechShop.

    API используется frontend-приложением и административной панелью.
    Документация предназначена для разработчиков и QA-инженеров.
  version: 1.0.0

servers:
  - url: http://kisusmister1.fvds.ru/api
    description: Staging
  - url: http://kisusmister.fvds.ru/api
    description: Production

tags:
  - name: Аутентификация
  - name: Товары
  - name: Корзина
  - name: Заказы
  - name: Администрирование
  - name: Отзывы

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Описание ошибки

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
            name:
              type: string
            role:
              type: string

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        stock:
          type: integer
        category:
          type: string
        image:
          type: string
        active:
          type: integer

    Review:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        user_id:
          type: integer
        user_name:
          type: string
        rating:
          type: integer
        text:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        created_at:
          type: string
        product_name:
          type: string
        product_image:
          type: string
        product_active:
          type: integer
        user_email:
          type: string

    ReviewStats:
      type: object
      properties:
        total:
          type: integer
        average:
          type: number
          format: float
        distribution:
          type: object
          properties:
            "5":
              type: integer
            "4":
              type: integer
            "3":
              type: integer
            "2":
              type: integer
            "1":
              type: integer

paths:

  /auth/register:
    post:
      tags: [Аутентификация]
      summary: Регистрация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                password:
                  type: string
                name:
                  type: string
      responses:
        200:
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        400:
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Аутентификация]
      summary: Авторизация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        401:
          description: Неверные учетные данные

  /auth/me:
    get:
      tags: [Аутентификация]
      summary: Текущий пользователь
      security:
        - BearerAuth: []
      responses:
        200:
          description: Данные пользователя

  /auth/expire:
    post:
      tags: [Аутентификация]
      summary: Протухление сессии по authToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authToken]
              properties:
                authToken:
                  type: string
      responses:
        200:
          description: Сессия протухла
        400:
          description: Ошибка валидации

  /products:
    get:
      tags: [Товары]
      summary: Получение списка товаров
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, name]
      responses:
        200:
          description: Список товаров
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

  /products/{id}:
    get:
      tags: [Товары]
      summary: Получение товара по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Товар
        404:
          description: Товар не найден

  /cart:
    get:
      tags: [Корзина]
      summary: Получение корзины
      security:
        - BearerAuth: []
      responses:
        200:
          description: Корзина пользователя

  /cart/add:
    post:
      tags: [Корзина]
      summary: Добавление товара в корзину
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId:
                  type: integer
                quantity:
                  type: integer
      responses:
        200:
          description: Товар добавлен

  /reviews/product/{id}:
    get:
      tags: [Отзывы]
      summary: Получить отзывы по товару
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Список отзывов и статистика
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
                  stats:
                    $ref: "#/components/schemas/ReviewStats"

  /reviews:
    post:
      tags: [Отзывы]
      summary: Оставить отзыв о товаре
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, rating, text]
              properties:
                productId:
                  type: integer
                rating:
                  type: integer
                text:
                  type: string
      responses:
        200:
          description: Отзыв отправлен на модерацию
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  review:
                    type: object
                    properties:
                      id:
                        type: integer
                      status:
                        type: string
                      created_at:
                        type: string
        400:
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: Требуется авторизация
        403:
          description: Недействительный токен
        404:
          description: Товар не найден

  /reviews/my:
    get:
      tags: [Отзывы]
      summary: Получить мои отзывы
      security:
        - BearerAuth: []
      responses:
        200:
          description: Список отзывов пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
        401:
          description: Требуется авторизация
        403:
          description: Недействительный токен

  /reviews/{id}:
    delete:
      tags: [Отзывы]
      summary: Удалить свой отзыв
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Отзыв удалён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        401:
          description: Требуется авторизация
        403:
          description: Недействительный токен
        404:
          description: Отзыв не найден

  /admin/reviews:
    get:
      tags: [Администрирование]
      summary: Получить все отзывы (админ)
      security:
        - BearerAuth: []
      responses:
        200:
          description: Список отзывов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
        401:
          description: Требуется авторизация
        403:
          description: Доступ только для администратора

  /admin/reviews/{id}/status:
    put:
      tags: [Администрирование]
      summary: Обновить статус отзыва (админ)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, approved, rejected]
      responses:
        200:
          description: Статус отзыва обновлён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        400:
          description: Ошибка валидации
        401:
          description: Требуется авторизация
        403:
          description: Доступ только для администратора
        404:
          description: Отзыв не найден

  /admin/reviews/{id}:
    delete:
      tags: [Администрирование]
      summary: Удалить отзыв (админ)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Отзыв удалён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        401:
          description: Требуется авторизация
        403:
          description: Доступ только для администратора
        404:
          description: Отзыв не найден

  /orders/checkout:
    post:
      tags: [Заказы]
      summary: Оформление заказа
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingAddress, cardNumber, cardExpiry, cardCvc]
              properties:
                shippingAddress:
                  type: string
                cardNumber:
                  type: string
                cardExpiry:
                  type: string
                cardCvc:
                  type: string
      responses:
        200:
          description: Заказ оформлен

  /orders:
    get:
      tags: [Заказы]
      summary: Получить заказы пользователя
      security:
        - BearerAuth: []
      responses:
        200:
          description: Список заказов
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    user_id:
                      type: integer
                      example: 2
                    total:
                      type: number
                      format: float
                      example: 89.99
                    discount:
                      type: number
                      format: float
                      example: 10
                    promocode:
                      type: string
                      nullable: true
                      example: SAVE10
                    status:
                      type: string
                      example: pending
                    shipping_address:
                      type: string
                      example: Moscow, Tverskaya 1
                    payment_method:
                      type: string
                      example: card
                    card_last4:
                      type: string
                      example: "4242"
                    created_at:
                      type: string
                      format: date-time
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          order_id:
                            type: integer
                            example: 1
                          product_id:
                            type: integer
                            example: 3
                          product_name:
                            type: string
                            example: Leather Laptop Bag
                          quantity:
                            type: integer
                            example: 1
                          price:
                            type: number
                            format: float
                            example: 89.99
        401:
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/stats:
    get:
      tags: [Администрирование]
      summary: Получение статистики
      security:
        - BearerAuth: []
      responses:
        200:
          description: Статистика системы
