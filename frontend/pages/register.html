<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - TechShop</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="/" class="logo">
                <i class="fas fa-shopping-bag"></i>
                TechShop
            </a>
        </div>
    </header>

    <main class="main">
        <div class="form-container">
            <h2 class="form-title">Регистрация</h2>
            
            <form id="register-form">
                <div class="form-group">
                    <label for="name">Имя</label>
                    <input type="text" id="name" name="name" placeholder="Ваше имя">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <!-- BUG #5: type="text" вместо type="email" - нет базовой валидации -->
                    <input type="text" id="email" name="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <!-- BUG #2: Нет атрибута required - можно отправить пустой пароль -->
                    <input type="password" id="password" name="password" placeholder="Минимум 6 символов">
                </div>

                <div class="form-group">
                    <label for="password-confirm">Подтвердите пароль</label>
                    <input type="password" id="password-confirm" name="password-confirm" placeholder="Повторите пароль">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <i class="fas fa-user-plus"></i>
                    Зарегистрироваться
                </button>
            </form>

            <div class="form-footer">
                <p>Уже есть аккаунт? <a href="/pages/login.html">Войти</a></p>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password-confirm').value;

            // Простая проверка на совпадение паролей (но нет проверки на пустоту!)
            if (password !== passwordConfirm) {
                showToast('Пароли не совпадают', 'error');
                return;
            }

            await register(email, password, name);
        });
    </script>
</body>
</html>
