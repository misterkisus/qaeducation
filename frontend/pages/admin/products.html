<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление товарами - TechShop</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="/" class="logo"><i class="fas fa-shopping-bag"></i> TechShop</a>
            <div class="auth-section" id="auth-section"></div>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <nav class="admin-menu">
                <a href="/pages/admin/dashboard.html"><i class="fas fa-chart-line"></i> Дашборд</a>
                <a href="/pages/admin/products.html" class="active"><i class="fas fa-box"></i> Товары</a>
                <a href="/pages/admin/orders.html"><i class="fas fa-shopping-bag"></i> Заказы</a>
                <a href="/pages/admin/reviews.html"><i class="fas fa-star"></i> Отзывы</a>
                <a href="/pages/admin/wishlist.html"><i class="fas fa-heart"></i> Избранное</a>
                <a href="/pages/admin/promocodes.html"><i class="fas fa-ticket-alt"></i> Промокоды</a>
                <a href="/"><i class="fas fa-store"></i> На сайт</a>
            </nav>
        </aside>

        <main class="admin-content">
            <div class="admin-header">
                <h1><i class="fas fa-box"></i> Управление товарами</h1>
                <button class="btn btn-primary" onclick="openProductModal()">
                    <i class="fas fa-plus"></i> Добавить товар
                </button>
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Фото</th>
                        <th>Название</th>
                        <th>Цена</th>
                        <th>Остаток</th>
                        <th>Категория</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="products-tbody">
                    <tr><td colspan="7" style="text-align: center;">Загрузка...</td></tr>
                </tbody>
            </table>
        </main>
    </div>

    <!-- Product Modal -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Добавить товар</h3>
                <button class="modal-close" onclick="closeProductModal()">&times;</button>
            </div>
            <form id="product-form">
                <div class="form-group">
                    <label for="product-name">Название *</label>
                    <input type="text" id="product-name" required>
                </div>
                <div class="form-group">
                    <label for="product-description">Описание</label>
                    <textarea id="product-description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="product-price">Цена *</label>
                    <input type="number" id="product-price" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="product-stock">Остаток на складе</label>
                    <input type="number" id="product-stock" min="0" value="0">
                </div>
                <div class="form-group">
                    <label for="product-category">Категория</label>
                    <input type="text" id="product-category" placeholder="Electronics">
                </div>
                <div class="form-group">
                    <label for="product-image">URL изображения</label>
                    <input type="text" id="product-image" placeholder="https://...">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <i class="fas fa-save"></i> Сохранить
                </button>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/app.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
