<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы - Админ-панель</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="/" class="logo"><i class="fas fa-shopping-bag"></i> TechShop</a>
            <div class="auth-section" id="auth-section"></div>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <nav class="admin-menu">
                <a href="/pages/admin/dashboard.html"><i class="fas fa-chart-line"></i> Дашборд</a>
                <a href="/pages/admin/products.html"><i class="fas fa-box"></i> Товары</a>
                <a href="/pages/admin/orders.html" class="active"><i class="fas fa-shopping-bag"></i> Заказы</a>
                <a href="/"><i class="fas fa-store"></i> На сайт</a>
            </nav>
        </aside>

        <main class="admin-content">
            <div class="admin-header">
                <h1><i class="fas fa-shopping-bag"></i> Заказы</h1>
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Клиент</th>
                        <th>Товары</th>
                        <th>Сумма</th>
                        <th>Статус</th>
                        <th>Дата</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="orders-tbody"></tbody>
            </table>
        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/app.js"></script>
    <script>
        async function loadOrders() {
            try {
                const res = await apiRequest('/admin/orders');
                const orders = await res.json();
                
                const tbody = document.getElementById('orders-tbody');
                tbody.innerHTML = orders.map(o => `
                    <tr>
                        <td><strong>#${o.id}</strong></td>
                        <td>
                            <div>${o.user_name}</div>
                            <small style="color: var(--text-light);">${o.email}</small>
                        </td>
                        <td>
                            ${o.items.map(i => `${i.product_name} ×${i.quantity}`).join('<br>')}
                        </td>
                        <td>
                            <strong>${formatPrice(o.total)}</strong>
                            ${o.discount > 0 ? `<br><small style="color: #4caf50;">-${formatPrice(o.discount)}</small>` : ''}
                        </td>
                        <td>
                            <select onchange="updateStatus(${o.id}, this.value)" style="padding: 5px; border-radius: 4px;">
                                <option value="pending" ${o.status === 'pending' ? 'selected' : ''}>Ожидает</option>
                                <option value="processing" ${o.status === 'processing' ? 'selected' : ''}>В обработке</option>
                                <option value="shipped" ${o.status === 'shipped' ? 'selected' : ''}>Отправлен</option>
                                <option value="delivered" ${o.status === 'delivered' ? 'selected' : ''}>Доставлен</option>
                                <option value="cancelled" ${o.status === 'cancelled' ? 'selected' : ''}>Отменён</option>
                            </select>
                        </td>
                        <td>${formatDate(o.created_at)}</td>
                        <td>
                            <button class="btn btn-sm btn-outline" onclick="alert('Адрес: ${o.shipping_address}')">
                                <i class="fas fa-info-circle"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Failed to load orders:', e);
            }
        }

        async function updateStatus(id, status) {
            try {
                const res = await apiRequest(`/admin/orders/${id}/status`, {
                    method: 'PUT',
                    body: JSON.stringify({ status })
                });
                if (res.ok) {
                    showToast('Статус обновлён', 'success');
                }
            } catch (e) {
                showToast('Ошибка', 'error');
            }
        }

        checkAuth();
        loadOrders();
    </script>
</body>
</html>
