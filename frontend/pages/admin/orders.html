<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы - Админ-панель</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="/" class="logo"><i class="fas fa-shopping-bag"></i> TechShop</a>
            <div class="auth-section" id="auth-section"></div>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <nav class="admin-menu">
                <a href="/pages/admin/dashboard.html"><i class="fas fa-chart-line"></i> Дашборд</a>
                <a href="/pages/admin/products.html"><i class="fas fa-box"></i> Товары</a>
                <a href="/pages/admin/orders.html" class="active"><i class="fas fa-shopping-bag"></i> Заказы</a>
                <a href="/pages/admin/reviews.html"><i class="fas fa-star"></i> Отзывы</a>
                <a href="/pages/admin/wishlist.html"><i class="fas fa-heart"></i> Избранное</a>
                <a href="/"><i class="fas fa-store"></i> На сайт</a>
            </nav>
        </aside>

        <main class="admin-content">
            <div class="admin-header">
                <h1><i class="fas fa-shopping-bag"></i> Заказы</h1>
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Клиент</th>
                        <th>Товары</th>
                        <th>Сумма</th>
                        <th>Статус</th>
                        <th>Дата</th>
                    </tr>
                </thead>
                <tbody id="orders-tbody">
                    <tr><td colspan="6" style="text-align: center;">Загрузка...</td></tr>
                </tbody>
            </table>
        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/app.js"></script>
    <script>
        async function loadOrders() {
            try {
                const res = await apiRequest('/admin/orders');
                const orders = await res.json();
                const tbody = document.getElementById('orders-tbody');

                if (orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #666;">Нет заказов</td></tr>';
                    return;
                }

                tbody.innerHTML = orders.map((o) => `
                    <tr>
                        <td><strong>#${o.id}</strong></td>
                        <td>
                            <div>${o.user_name || '-'}</div>
                            <small style="color: var(--text-light);">${o.email || '-'}</small>
                        </td>
                        <td style="max-width: 250px;">
                            ${o.items.map((i) => `<div>${i.product_name} x${i.quantity}</div>`).join('')}
                        </td>
                        <td>
                            <strong>${formatPrice(o.total)}</strong>
                            ${o.discount > 0 ? `<br><small style="color: #4caf50;">Скидка: -${formatPrice(o.discount)}</small>` : ''}
                        </td>
                        <td>
                            <select onchange="updateStatus(${o.id}, this.value)" style="padding: 8px; border-radius: 4px; border: 1px solid #ddd;">
                                <option value="pending" ${o.status === 'pending' ? 'selected' : ''}>Ожидает</option>
                                <option value="processing" ${o.status === 'processing' ? 'selected' : ''}>В обработке</option>
                                <option value="shipped" ${o.status === 'shipped' ? 'selected' : ''}>Отправлен</option>
                                <option value="delivered" ${o.status === 'delivered' ? 'selected' : ''}>Доставлен</option>
                                <option value="cancelled" ${o.status === 'cancelled' ? 'selected' : ''}>Отменён</option>
                            </select>
                        </td>
                        <td>${formatDate(o.created_at)}</td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Failed to load orders:', e);
                showToast('Ошибка загрузки заказов', 'error');
            }
        }

        async function updateStatus(id, status) {
            try {
                const res = await apiRequest(`/admin/orders/${id}/status`, {
                    method: 'PUT',
                    body: JSON.stringify({ status })
                });

                if (res.ok) {
                    showToast('Статус обновлён', 'success');
                } else {
                    const data = await res.json();
                    showToast(data.error || 'Ошибка', 'error');
                    loadOrders();
                }
            } catch (e) {
                showToast('Ошибка соединения', 'error');
            }
        }

        checkAuth();
        loadOrders();
    </script>
</body>
</html>
