<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранное - TechShop</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .wishlist-card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
            transition: transform 0.3s;
        }
        .wishlist-card:hover {
            transform: translateY(-5px);
        }
        .wishlist-card.unavailable {
            opacity: 0.6;
        }
        .wishlist-card.unavailable::after {
            content: 'Товар недоступен';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
        }
        .wishlist-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .wishlist-info {
            padding: 20px;
        }
        .wishlist-name {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .wishlist-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .wishlist-stock {
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        .wishlist-stock.in-stock { color: #4caf50; }
        .wishlist-stock.low-stock { color: #ff9800; }
        .wishlist-stock.out-of-stock { color: #f44336; }
        .wishlist-actions {
            display: flex;
            gap: 10px;
        }
        .wishlist-actions .btn {
            flex: 1;
            justify-content: center;
            font-size: 0.9rem;
        }
        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: white;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            transition: all 0.2s;
        }
        .remove-btn:hover {
            background: #f44336;
            color: white;
        }
        .added-date {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
        .wishlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .wishlist-count {
            background: var(--primary);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="/" class="logo"><i class="fas fa-shopping-bag"></i> TechShop</a>
            <nav class="nav">
                <a href="/" class="nav-link">Каталог</a>
                <a href="/pages/wishlist.html" class="nav-link active">
                    <i class="fas fa-heart"></i> Избранное
                    <span class="cart-count" id="wishlist-count">0</span>
                </a>
                <a href="/pages/cart.html" class="nav-link">
                    <i class="fas fa-shopping-cart"></i> Корзина
                    <span class="cart-count" id="cart-count">0</span>
                </a>
            </nav>
            <div class="auth-section" id="auth-section"></div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="wishlist-header">
                <h1><i class="fas fa-heart" style="color: #e74c3c;"></i> Избранное</h1>
                <span class="wishlist-count" id="total-count">0 товаров</span>
            </div>
            
            <div id="wishlist-container">
                <div style="text-align: center; padding: 50px;">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p style="margin-top: 15px;">Загрузка...</p>
                </div>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/app.js"></script>
    <script>
        async function loadWishlist() {
            const container = document.getElementById('wishlist-container');
            
            if (!authToken) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-sign-in-alt"></i>
                        <h3>Войдите в аккаунт</h3>
                        <p>Чтобы просматривать избранное, необходимо авторизоваться</p>
                        <a href="/pages/login.html" class="btn btn-primary">Войти</a>
                    </div>
                `;
                return;
            }
            
            try {
                const res = await apiRequest('/wishlist');
                const data = await res.json();
                
                document.getElementById('wishlist-count').textContent = data.count;
                document.getElementById('total-count').textContent = `${data.count} ${getProductWord(data.count)}`;
                
                if (data.items.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-heart"></i>
                            <h3>Избранное пусто</h3>
                            <p>Добавляйте понравившиеся товары, нажимая на сердечко</p>
                            <a href="/" class="btn btn-primary">Перейти в каталог</a>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = `
                    <div class="wishlist-grid">
                        ${data.items.map(item => createWishlistCard(item)).join('')}
                    </div>
                `;
                
            } catch (e) {
                console.error('Failed to load wishlist:', e);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Ошибка загрузки</h3>
                        <button class="btn btn-primary" onclick="loadWishlist()">Повторить</button>
                    </div>
                `;
            }
        }
        
        function createWishlistCard(item) {
            const product = item.product;
            
            // Товар удалён или неактивен
            if (!product || product.active === 0) {
                return `
                    <div class="wishlist-card unavailable">
                        <button class="remove-btn" onclick="removeFromWishlist(${item.id})" title="Удалить">
                            <i class="fas fa-times"></i>
                        </button>
                        <img src="https://via.placeholder.com/400x180?text=Товар+удалён" class="wishlist-image">
                        <div class="wishlist-info">
                            <div class="wishlist-name">Товар больше недоступен</div>
                            <div class="wishlist-actions">
                                <button class="btn btn-outline btn-sm" onclick="removeFromWishlist(${item.id})">
                                    <i class="fas fa-trash"></i> Удалить
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            let stockClass, stockText;
            if (product.stock === 0) {
                stockClass = 'out-of-stock';
                stockText = 'Нет в наличии';
            } else if (product.stock < 10) {
                stockClass = 'low-stock';
                stockText = `Осталось ${product.stock} шт.`;
            } else {
                stockClass = 'in-stock';
                stockText = 'В наличии';
            }
            
            const addedDate = new Date(item.added_at).toLocaleDateString('ru-RU');
            
            return `
                <div class="wishlist-card">
                    <button class="remove-btn" onclick="removeFromWishlist(${item.id})" title="Удалить из избранного">
                        <i class="fas fa-times"></i>
                    </button>
                    <a href="/pages/product.html?id=${product.id}">
                        <img src="${product.image}" class="wishlist-image" alt="${product.name}"
                             onerror="this.src='https://via.placeholder.com/400x180?text=No+Image'">
                    </a>
                    <div class="wishlist-info">
                        <a href="/pages/product.html?id=${product.id}" style="text-decoration: none; color: inherit;">
                            <div class="wishlist-name">${product.name}</div>
                        </a>
                        <div class="wishlist-price">${formatPrice(product.price)}</div>
                        <div class="wishlist-stock ${stockClass}">
                            <i class="fas fa-${product.stock > 0 ? 'check-circle' : 'times-circle'}"></i>
                            ${stockText}
                        </div>
                        <div class="wishlist-actions">
                            ${product.stock > 0 ? `
                                <button class="btn btn-primary btn-sm" onclick="moveToCart(${item.id})">
                                    <i class="fas fa-cart-plus"></i> В корзину
                                </button>
                            ` : `
                                <button class="btn btn-outline btn-sm" disabled>
                                    Нет в наличии
                                </button>
                            `}
                        </div>
                        <div class="added-date">
                            <i class="fas fa-clock"></i> Добавлено ${addedDate}
                        </div>
                    </div>
                </div>
            `;
        }
        
        async function removeFromWishlist(id) {
            try {
                const res = await apiRequest(`/wishlist/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    showToast('Удалено из избранного', 'success');
                    loadWishlist();
                } else {
                    const data = await res.json();
                    showToast(data.error || 'Ошибка', 'error');
                }
            } catch (e) {
                showToast('Ошибка соединения', 'error');
            }
        }
        
        async function moveToCart(id) {
            try {
                const res = await apiRequest(`/wishlist/${id}/move-to-cart`, { method: 'POST' });
                const data = await res.json();
                
                if (res.ok) {
                    showToast('Товар перемещён в корзину', 'success');
                    loadWishlist();
                    updateCartCount();
                } else {
                    showToast(data.error || 'Ошибка', 'error');
                }
            } catch (e) {
                showToast('Ошибка соединения', 'error');
            }
        }
        
        function getProductWord(count) {
            const lastDigit = count % 10;
            const lastTwoDigits = count % 100;
            
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) return 'товаров';
            if (lastDigit === 1) return 'товар';
            if (lastDigit >= 2 && lastDigit <= 4) return 'товара';
            return 'товаров';
        }
        
        // Init
        checkAuth();
        loadWishlist();
        updateCartCount();
    </script>
</body>
</html>
