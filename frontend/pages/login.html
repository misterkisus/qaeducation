<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - TechShop</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="/" class="logo">
                <i class="fas fa-shopping-bag"></i>
                TechShop
            </a>
        </div>
    </header>

    <main class="main">
        <div class="form-container">
            <h2 class="form-title">Вход в аккаунт</h2>
            
            <form id="login-form" autocomplete="off">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <i class="fas fa-sign-in-alt"></i>
                    Войти
                </button>
            </form>

            <div class="form-footer">
                <p>Нет аккаунта? <a href="/pages/register.html">Зарегистрироваться</a></p>
            </div>

            <div style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                <strong>Тестовые аккаунты:</strong><br>
                <br>
                User: user@test.com / user123
            </div>
        </div>
    </main>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/app.js"></script>
    <script>
        function clearLoginForm() {
            const form = document.getElementById('login-form');
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            if (!form || !email || !password) return;

            form.reset();
            email.value = '';
            password.value = '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            clearLoginForm();
            setTimeout(clearLoginForm, 50);
        });

        window.addEventListener('pageshow', () => {
            clearLoginForm();
            setTimeout(clearLoginForm, 50);
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            await login(email, password);
        });
    </script>
</body>
</html>
